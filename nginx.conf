limit_req_zone $binary_remote_addr zone=purrheavy:1m rate=1r/s;

server {
	listen 80;
	listen [::]:80;
	server_name @HOST@;

	add_header X-Content-Type-Options nosniff always;

	location = /git.css { alias @DIR@/git.css; }
	location = /git.js { alias @DIR@/git.js; }
	location = /theme.js { alias @DIR@/theme.js; }

	location ~ ^/[^/]+/[^/]+/(archive/|info/refs$|git-upload-pack$) {
		limit_req zone=purrheavy burst=20 nodelay;
		limit_req_status 429;
		client_max_body_size 100m;
		fastcgi_read_timeout 300s;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME @DIR@/web.sh;
		fastcgi_param PATH_INFO $uri;
		fastcgi_pass unix:/run/purr.sock;
	}

	location / {
		client_max_body_size 100m;
		fastcgi_read_timeout 300s;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME @DIR@/web.sh;
		fastcgi_param PATH_INFO $uri;
		fastcgi_pass unix:/run/purr.sock;
	}
}
